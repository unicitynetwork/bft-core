[package]
name = "sp1-verifier-ffi"
version = "0.1.0"
edition = "2021"

# Make this package independent of parent workspace
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
sp1-sdk = "5.0.8"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
