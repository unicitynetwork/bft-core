[package]
name = "aggregator-zk-verifier-ffi"
version = "0.1.0"
edition = "2021"

# Standalone workspace — does not participate in the bft-core Go module build.
[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Must match the sp1-sdk version used in rugregator/crates/zk-host (6.0.2).
# This is independent of sp1-verifier-ffi which uses 5.0.8 for the EVM prover.
# No "blocking" feature — we only need the type layer (SP1VerifyingKey,
# SP1ProofWithPublicValues, SP1Proof, HashableKey).  Verification is handled
# by the lightweight sp1-verifier crate without any CpuProver/worker overhead.
sp1-sdk      = { version = "6.0.2", features = ["blocking"] }
sp1-verifier = { version = "6.0.2", features = ["std"] }
anyhow  = "1.0"
bincode = "1.3"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
